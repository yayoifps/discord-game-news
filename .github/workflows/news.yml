name: Game News to Discord

on:
  schedule:
    # 毎時0分は全世界のリポジトリが一斉予約して混雑し遅延しやすいため、数分ずらしてある
    # (GitHub Actionsのschedule実行は時刻を保証しないため、それでも多少のズレは起こりうる)
    - cron: '7 20 * * *'   # UTC 20:07 = JST 5:07起動 → 目安JST 6:00
    - cron: '13 2 * * *'   # UTC 2:13  = JST 11:13起動 → 目安JST 12:00
    - cron: '22 8 * * *'   # UTC 8:22  = JST 17:22起動 → 目安JST 18:00
    - cron: '38 11 * * *'  # UTC 11:38 = JST 20:38起動 → 目安JST 21:00
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news and notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/main.py

      - name: Commit sent articles record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sent_articles.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update sent articles record"
            git push
          fi
