name: Game News to Discord

on:
  schedule:
    - cron: '0 23 * * *'  # UTC 23:00 = JST 8:00
    - cron: '0 11 * * *'  # UTC 11:00 = JST 20:00
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news and notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/main.py

      - name: Commit sent articles record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sent_articles.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update sent articles record"
            git push
          fi
